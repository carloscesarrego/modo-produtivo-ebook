name: Assemble PDF
on:
  push:
    branches: [main]
    paths:
      - 'build/ascii/**'
      - 'build/chunks/**'
      - 'build/assemble.sh'
      - '.github/workflows/assemble-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble PDF
        run: bash build/assemble.sh
      - name: Commit PDF if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ebook-ia-pratica.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes"
          else
            git commit -m "Add ebook PDF for customer download"
            git push
          fi
